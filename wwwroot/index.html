<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Приказ о создании НФГО</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --line:#d9dee4; --ink:#1d2733; --muted:#66727f; --accent:#1f5fae; --danger:#b3261e; --ok:#1b7f3b; --warn:#9a6700; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:#16324f; color:#fff; padding:14px 24px; }
  header h1 { margin:0 0 10px; font-size:20px; font-weight:600; }
  nav { display:flex; gap:6px; flex-wrap:wrap; }
  nav button { background:transparent; color:#cfe0f3; border:1px solid #38597d; padding:6px 14px; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.active { background:#fff; color:#16324f; border-color:#fff; }
  main { max-width:1180px; margin:20px auto; padding:0 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:17px; } h3 { margin:0 0 10px; font-size:15px; }
  form.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 14px; align-items:end; }
  label { display:flex; flex-direction:column; gap:3px; font-size:12.5px; color:var(--muted); }
  input, select, textarea { font:inherit; color:var(--ink); padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; min-width:0; }
  textarea { resize:vertical; min-height:60px; }
  .wide { grid-column:1/-1; }
  button.btn { background:var(--accent); color:#fff; border:0; padding:8px 16px; border-radius:6px; cursor:pointer; font:inherit; }
  button.btn:hover { filter:brightness(1.1); }
  button.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); padding:5px 10px; border-radius:6px; cursor:pointer; font:inherit; font-size:13px; }
  button.ghost:hover { background:#eef2f6; }
  button.danger { color:var(--danger); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12.5px; background:#fafbfc; }
  td.actions { white-space:nowrap; text-align:right; }
  td.actions > * { margin-left:4px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .Draft { background:#fff4d6; color:var(--warn); } .Signed { background:#dff5e6; color:var(--ok); } .Cancelled { background:#f6dcdb; color:var(--danger); }
  .warn { background:#fff8e1; border:1px solid #f0d98a; color:#6b5200; padding:10px 14px; border-radius:8px; margin-top:12px; }
  .warn ul { margin:6px 0 0 18px; padding:0; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .chip { background:#eef2f6; border-radius:6px; padding:3px 8px; font-size:13px; }
  .chip button { border:0; background:none; color:var(--danger); cursor:pointer; padding:0 0 0 6px; font-size:14px; }
  #toast { position:fixed; right:18px; bottom:18px; background:#16324f; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:.25s; max-width:420px; pointer-events:none; }
  #toast.show { opacity:1; } #toast.err { background:var(--danger); }
  .tab { display:none; } .tab.active { display:block; }
  .two { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
</style>
</head>
<body>
<header>
  <h1>Приказ о создании НФГО — формирование и привязка к сотрудникам, ролям и СИЗ</h1>
  <nav id="nav">
    <button data-tab="orders" class="active">Приказы</button>
    <button data-tab="assign">Назначения</button>
    <button data-tab="dirs">Справочники</button>
    <button data-tab="roles">Роли и нормы СИЗ</button>
    <a href="/swagger" target="_blank" style="color:#cfe0f3;align-self:center;margin-left:8px;font-size:13px">Swagger ↗</a>
  </nav>
</header>

<main>
  <!-- ПРИКАЗЫ -->
  <section id="tab-orders" class="tab active">
    <div class="card">
      <h2>Сформировать приказ</h2>
      <p class="muted" style="margin-top:0">В приказ автоматически попадут все текущие назначения (вкладка «Назначения»), а СИЗ подтянутся по нормам ролей.</p>
      <form id="orderForm" class="grid">
        <label>Номер приказа<input name="number" required placeholder="напр. 15-ГО"></label>
        <label>Дата<input name="orderDate" type="date" required></label>
        <label>Организация<input name="organization" required placeholder="ООО «Пример»"></label>
        <label>Должность руководителя<input name="headPosition" required placeholder="Генеральный директор"></label>
        <label>ФИО руководителя<input name="headFullName" required placeholder="Иванов И.И."></label>
        <label class="wide">Основание (если пусто — подставится стандартная формулировка)<textarea name="basis"></textarea></label>
        <div class="wide"><button class="btn">Сформировать приказ</button></div>
      </form>
      <div id="genWarnings"></div>
    </div>
    <div class="card"><h2>Приказы</h2><div id="ordersList"></div></div>
    <div class="card" id="orderDetail" style="display:none"></div>
  </section>

  <!-- НАЗНАЧЕНИЯ -->
  <section id="tab-assign" class="tab">
    <div class="card">
      <h2>Включить сотрудника в НФГО</h2>
      <form id="assignForm" class="grid">
        <label>Сотрудник<select name="employeeId" required></select></label>
        <label>Формирование<select name="unitId" required></select></label>
        <label>Роль<select name="roleId" required></select></label>
        <div><button class="btn">Добавить</button></div>
      </form>
    </div>
    <div class="card"><h2>Назначения</h2><div id="assignList"></div></div>
  </section>

  <!-- СПРАВОЧНИКИ -->
  <section id="tab-dirs" class="tab">
    <div class="card" id="dirEmployees"></div>
    <div class="two">
      <div class="card" id="dirUnits"></div>
      <div class="card" id="dirSiz"></div>
    </div>
  </section>

  <!-- РОЛИ -->
  <section id="tab-roles" class="tab">
    <div class="card">
      <h2>Новая роль</h2>
      <form id="roleForm" class="grid">
        <label>Название<input name="name" required placeholder="напр. Радиационный разведчик"></label>
        <label>Описание<input name="description"></label>
        <label>Порядок в приказе<input name="priority" type="number" min="1" max="1000" value="100"></label>
        <div><button class="btn">Добавить роль</button></div>
      </form>
    </div>
    <div id="rolesList"></div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = { Draft:'Проект', Signed:'Подписан', Cancelled:'Отменён' };
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';

async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, { method, headers:{'Content-Type':'application/json'}, body: body !== undefined ? JSON.stringify(body) : undefined });
  if (!r.ok) {
    let m = r.statusText;
    try { const j = await r.json(); m = j.error || (j.errors ? Object.values(j.errors).flat().join('; ') : j.title) || m; } catch {}
    throw new Error(m);
  }
  return r.status === 204 ? null : r.json();
}
let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 3500);
}
const guard = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
const formData = f => Object.fromEntries(new FormData(f).entries());

/* ---------- вкладки ---------- */
document.querySelectorAll('#nav button').forEach(b => b.onclick = guard(async () => {
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + b.dataset.tab));
  await ({ orders: loadOrders, assign: loadAssign, dirs: loadDirs, roles: loadRoles })[b.dataset.tab]();
}));

/* ---------- приказы ---------- */
$('#orderForm').orderDate.value = new Date().toISOString().slice(0, 10);
$('#orderForm').onsubmit = guard(async e => {
  e.preventDefault();
  const d = formData(e.target); if (!d.basis) delete d.basis;
  const res = await api('/orders/generate', 'POST', d);
  $('#genWarnings').innerHTML = res.warnings.length
    ? `<div class="warn"><b>Обратите внимание:</b><ul>${res.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
  toast(`Приказ № ${res.order.number} сформирован: ${res.order.members.length} чел.`);
  await loadOrders(); await showOrder(res.order.id);
});

async function loadOrders() {
  const list = await api('/orders');
  $('#ordersList').innerHTML = list.length ? `<table><thead><tr><th>№</th><th>Дата</th><th>Статус</th><th>Формирований</th><th>Участников</th><th></th></tr></thead><tbody>${
    list.map(o => `<tr>
      <td><b>${esc(o.number)}</b></td><td>${fmtDate(o.orderDate)}</td>
      <td><span class="badge ${o.status}">${STATUS[o.status]}</span></td>
      <td>${o.unitsCount}</td><td>${o.membersCount}</td>
      <td class="actions">
        <button class="ghost" onclick="showOrder(${o.id})">Открыть</button>
        <a class="ghost" style="text-decoration:none;display:inline-block" href="/api/orders/${o.id}/document">Word</a>
        ${o.status === 'Draft' ? `<button class="ghost" onclick="orderAct(${o.id},'regen')">Пересобрать</button>
          <button class="ghost" onclick="orderAct(${o.id},'Signed')">Подписать</button>` : ''}
        ${o.status !== 'Cancelled' ? `<button class="ghost" onclick="orderAct(${o.id},'Cancelled')">Отменить</button>` : ''}
        ${o.status !== 'Signed' ? `<button class="ghost danger" onclick="orderAct(${o.id},'del')">Удалить</button>` : ''}
      </td></tr>`).join('')}</tbody></table>` : '<p class="muted">Приказов пока нет.</p>';
}
window.orderAct = guard(async (id, act) => {
  if (act === 'regen') {
    const r = await api(`/orders/${id}/regenerate`, 'POST');
    $('#genWarnings').innerHTML = r.warnings.length ? `<div class="warn"><ul>${r.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';
    toast('Состав приказа обновлён по текущим назначениям');
  } else if (act === 'del') {
    if (!confirm('Удалить приказ?')) return; await api(`/orders/${id}`, 'DELETE'); $('#orderDetail').style.display = 'none';
  } else {
    if (act === 'Signed' && !confirm('Подписанный приказ нельзя пересобрать или удалить. Подписать?')) return;
    await api(`/orders/${id}/status`, 'PATCH', { status: act });
  }
  await loadOrders(); if ($('#orderDetail').dataset.id == id && act !== 'del') await showOrder(id);
});
window.showOrder = guard(async id => {
  const o = await api('/orders/' + id), box = $('#orderDetail');
  box.dataset.id = id; box.style.display = 'block';
  box.innerHTML = `
    <h2>Приказ № ${esc(o.number)} от ${fmtDate(o.orderDate)} <span class="badge ${o.status}">${STATUS[o.status]}</span></h2>
    <p class="muted">${esc(o.organization)} · ${esc(o.headPosition)} ${esc(o.headFullName)}</p>
    <p class="muted">Основание: ${esc(o.basis)}</p>
    <div class="chips">${o.units.map(u => `<span class="chip">${esc(u.unitName)}: ${u.membersCount} чел.</span>`).join('')}</div>
    <h3 style="margin-top:16px">Персональный состав и СИЗ</h3>
    <table><thead><tr><th>#</th><th>ФИО</th><th>Должность</th><th>Формирование</th><th>Роль</th><th>СИЗ</th></tr></thead><tbody>${
      o.members.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.employeeName)}</td><td>${esc(m.position)}</td><td>${esc(m.unitName)}</td><td>${esc(m.roleName)}</td>
        <td>${m.sizItems.map(s => `${esc(s.sizName)} — ${s.quantity} ${esc(s.unit)}`).join('<br>') || '—'}</td></tr>`).join('')}</tbody></table>
    <h3 style="margin-top:16px">Общая потребность в СИЗ</h3>
    <table style="max-width:560px"><thead><tr><th>Наименование</th><th>Ед.</th><th>Кол-во</th></tr></thead><tbody>${
      o.sizTotals.map(t => `<tr><td>${esc(t.sizName)}</td><td>${esc(t.unit)}</td><td>${t.total}</td></tr>`).join('')}</tbody></table>
    <p style="margin-top:14px"><a class="btn" style="text-decoration:none;display:inline-block" href="/api/orders/${o.id}/document">Скачать приказ (.docx)</a></p>`;
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

/* ---------- назначения ---------- */
const opts = (items, label, sel) => items.map(i => `<option value="${i.id}" ${i.id === sel ? 'selected' : ''}>${esc(label(i))}</option>`).join('');
async function loadAssign() {
  const [list, free, units, roles] = await Promise.all([api('/assignments'), api('/assignments/unassigned-employees'), api('/units'), api('/roles')]);
  const f = $('#assignForm');
  f.employeeId.innerHTML = free.length ? opts(free, e => `${e.fullName} (${e.position})`) : '<option value="">— все сотрудники уже назначены —</option>';
  f.unitId.innerHTML = opts(units, u => u.name); f.roleId.innerHTML = opts(roles, r => r.name);
  $('#assignList').innerHTML = list.length ? `<table><thead><tr><th>Сотрудник</th><th>Должность</th><th>Формирование</th><th>Роль</th><th></th></tr></thead><tbody>${
    list.map(a => `<tr data-id="${a.id}" data-emp="${a.employeeId}"><td>${esc(a.employeeName)}</td><td>${esc(a.employeePosition)}</td>
      <td><select class="u">${opts(units, u => u.name, a.unitId)}</select></td>
      <td><select class="r">${opts(roles, r => r.name, a.roleId)}</select></td>
      <td class="actions"><button class="ghost" onclick="saveAssign(this)">Сохранить</button><button class="ghost danger" onclick="delAssign(${a.id})">Исключить</button></td></tr>`).join('')}</tbody></table>`
    : '<p class="muted">Назначений пока нет.</p>';
}
$('#assignForm').onsubmit = guard(async e => {
  e.preventDefault(); const d = formData(e.target);
  await api('/assignments', 'POST', { employeeId: +d.employeeId, unitId: +d.unitId, roleId: +d.roleId });
  toast('Сотрудник включён в НФГО'); await loadAssign();
});
window.saveAssign = guard(async btn => {
  const tr = btn.closest('tr');
  await api('/assignments/' + tr.dataset.id, 'PUT', { employeeId: +tr.dataset.emp, unitId: +tr.querySelector('.u').value, roleId: +tr.querySelector('.r').value });
  toast('Назначение обновлено'); await loadAssign();
});
window.delAssign = guard(async id => { if (!confirm('Исключить сотрудника из НФГО?')) return; await api('/assignments/' + id, 'DELETE'); await loadAssign(); });

/* ---------- простые справочники ---------- */
async function renderDir(sel, cfg) {
  const items = await api(cfg.path), box = $(sel);
  box.innerHTML = `<h2>${cfg.title}</h2>
    <form class="grid">${cfg.fields.map(f => `<label>${f.label}<input name="${f.k}" ${f.req ? 'required' : ''}></label>`).join('')}
      <input type="hidden" name="id"><div class="row"><button class="btn">Сохранить</button><button type="button" class="ghost" data-reset>Сброс</button></div></form>
    <div style="margin-top:12px"><table><thead><tr>${cfg.fields.map(f => `<th>${f.label}</th>`).join('')}<th></th></tr></thead><tbody>${
      items.map(it => `<tr>${cfg.fields.map(f => `<td>${esc(it[f.k])}</td>`).join('')}
        <td class="actions"><button class="ghost" data-edit="${it.id}">Изм.</button><button class="ghost danger" data-del="${it.id}">✕</button></td></tr>`).join('')}</tbody></table></div>`;
  const form = box.querySelector('form');
  form.onsubmit = guard(async e => {
    e.preventDefault(); const d = formData(form), id = d.id; delete d.id;
    Object.keys(d).forEach(k => { if (d[k] === '') d[k] = (cfg.fields.find(f => f.k === k)?.req ? '' : null); });
    id ? await api(`${cfg.path}/${id}`, 'PUT', d) : await api(cfg.path, 'POST', d);
    toast('Сохранено'); await renderDir(sel, cfg);
  });
  box.querySelector('[data-reset]').onclick = () => form.reset();
  box.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    const it = items.find(x => x.id == b.dataset.edit); form.id.value = it.id;
    cfg.fields.forEach(f => form[f.k].value = it[f.k] ?? ''); form.scrollIntoView({ behavior:'smooth', block:'nearest' });
  });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = guard(async () => {
    if (!confirm('Удалить запись?')) return; await api(`${cfg.path}/${b.dataset.del}`, 'DELETE'); await renderDir(sel, cfg);
  }));
}
const loadDirs = () => Promise.all([
  renderDir('#dirEmployees', { title:'Сотрудники', path:'/employees', fields:[
    {k:'fullName',label:'ФИО',req:1},{k:'position',label:'Должность',req:1},{k:'department',label:'Подразделение'},{k:'personnelNumber',label:'Табельный №'}]}),
  renderDir('#dirUnits', { title:'Формирования НФГО', path:'/units', fields:[{k:'name',label:'Название',req:1},{k:'purpose',label:'Назначение'}]}),
  renderDir('#dirSiz', { title:'Виды СИЗ', path:'/siz-types', fields:[{k:'name',label:'Наименование',req:1},{k:'unit',label:'Ед. изм.',req:1},{k:'description',label:'Описание'}]})
]);

/* ---------- роли и нормы ---------- */
async function loadRoles() {
  const [roles, siz] = await Promise.all([api('/roles'), api('/siz-types')]);
  $('#rolesList').innerHTML = roles.map(r => `<div class="card" data-id="${r.id}">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(r.name)} <span class="muted">· порядок ${r.priority}</span></h3>
      <button class="ghost danger" onclick="delRole(${r.id})">Удалить роль</button></div>
    ${r.description ? `<p class="muted" style="margin:4px 0">${esc(r.description)}</p>` : ''}
    <div class="chips">${r.norms.map(n => `<span class="chip">${esc(n.sizName)} × ${n.quantity} ${esc(n.unit)}<button title="Убрать" onclick="removeNorm(${r.id},${n.sizTypeId})">✕</button></span>`).join('') || '<span class="muted">Нормы СИЗ не заданы</span>'}</div>
    <div class="row" style="margin-top:10px">
      <label>СИЗ<select class="ns">${opts(siz, s => s.name)}</select></label>
      <label>Кол-во<input class="nq" type="number" min="1" max="100" value="1" style="width:80px"></label>
      <button class="ghost" onclick="addNorm(${r.id})">Добавить / изменить норму</button></div></div>`).join('')
    || '<div class="card muted">Ролей пока нет.</div>';
  window._roles = roles;
}
const putNorms = async (roleId, norms) => { await api(`/roles/${roleId}/siz-norms`, 'PUT', norms.map(n => ({ sizTypeId: n.sizTypeId, quantity: n.quantity }))); await loadRoles(); };
window.addNorm = guard(async roleId => {
  const card = document.querySelector(`#rolesList [data-id="${roleId}"]`), role = window._roles.find(r => r.id === roleId);
  const sizTypeId = +card.querySelector('.ns').value, quantity = +card.querySelector('.nq').value;
  const norms = role.norms.filter(n => n.sizTypeId !== sizTypeId).concat([{ sizTypeId, quantity }]); await putNorms(roleId, norms);
});
window.removeNorm = guard(async (roleId, sizTypeId) => { await putNorms(roleId, window._roles.find(r => r.id === roleId).norms.filter(n => n.sizTypeId !== sizTypeId)); });
window.delRole = guard(async id => { if (!confirm('Удалить роль?')) return; await api('/roles/' + id, 'DELETE'); await loadRoles(); });
$('#roleForm').onsubmit = guard(async e => {
  e.preventDefault(); const d = formData(e.target);
  await api('/roles', 'POST', { name: d.name, description: d.description || null, priority: +d.priority || 100 });
  e.target.reset(); e.target.priority.value = 100; await loadRoles();
});

guard(loadOrders)();
</script>
</body>
</html>
